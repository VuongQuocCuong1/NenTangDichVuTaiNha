<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .alert-error {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid #f87171;
            display: none; 
        }
        .alert-error.show { display: block; }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2 class="auth-title">Đăng nhập</h2>
        <div id="errorBox" class="alert-error"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" required placeholder="Ví dụ: an@gmail.com">
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu của bạn">
            </div>
            <button type="submit" class="btn-submit">Đăng nhập ngay</button>
        </form>

       <div class="auth-footer">
            <!-- Sửa các đường link -->
            <a href="/forgot-password" class="forgot-link">Quên mật khẩu?</a>
            <span>Chưa có tài khoản? <a href="/register">Đăng ký</a></span>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');

        function showError(message) {
            errorBox.innerText = message;
            errorBox.classList.add('show');
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); 
            errorBox.classList.remove('show');
            errorBox.innerText = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const submitBtn = document.querySelector('.btn-submit');
                const originalText = submitBtn.innerText;
                submitBtn.innerText = 'Đang kiểm tra...';
                submitBtn.disabled = true;

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password, remember: true })
                });

                const result = await response.json();
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;

                if (response.ok) {
                    localStorage.setItem('userToken', result.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.user));

                    alert('Xin chào, ' + result.user.name + '! Đăng nhập thành công.');
                    // Sửa lệnh chuyển hướng về trang chủ
                    window.location.href = '/'; 
                } else {
                    showError(result.message || result.error || 'Đăng nhập thất bại');
                }
            } catch (error) {
                showError('Không thể kết nối đến máy chủ Backend!');
            }
        });
    </script>
</body>
</html>

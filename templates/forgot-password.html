<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .text-center {
            text-align: center;
        }

        .text-gray {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .otp-input {
            letter-spacing: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid #f87171;
            display: none;
        }

        .alert-error.show {
            display: block;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-card">
        <h2 class="auth-title" style="margin-bottom: 0.5rem;">Khôi phục mật khẩu</h2>
        <p id="stepDescription" class="text-center text-gray">Nhập địa chỉ email của bạn để nhận mã xác minh.</p>
        <div id="errorBox" class="alert-error"></div>

        <form id="step1Form">
            <div class="input-group">
                <label for="forgotEmail">Địa chỉ Email</label>
                <input type="text" id="forgotEmail" required placeholder="Ví dụ: nguyenvan@gmail.com">
            </div>
            <button type="submit" class="btn-submit" id="btnStep1">Gửi mã OTP qua Email</button>
            <!-- Sửa link quay lại -->
            <a href="/login" class="back-link">&larr; Quay lại Đăng nhập</a>
        </form>

        <form id="step2Form" class="hidden">
            <div class="input-group">
                <label for="otpCode">Mã xác minh (OTP)</label>
                <input type="text" id="otpCode" class="otp-input" required placeholder="Nhập 6 số" maxlength="6">
            </div>
            <button type="submit" class="btn-submit" id="btnStep2">Xác nhận OTP</button>
            <button type="button" id="btnBackToStep1" class="back-link"
                style="background: none; border: none; width: 100%; cursor: pointer;">Đổi địa chỉ email khác</button>
        </form>

        <form id="step3Form" class="hidden">
            <div class="input-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" required placeholder="Ít nhất 6 ký tự, gồm chữ và số">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Nhập lại mật khẩu</label>
                <input type="password" id="confirmPassword" required placeholder="Xác nhận mật khẩu mới">
            </div>
            <button type="submit" class="btn-submit" id="btnStep3">Lưu mật khẩu mới</button>
        </form>
    </div>

    <script>
        const step1Form = document.getElementById('step1Form');
        const step2Form = document.getElementById('step2Form');
        const step3Form = document.getElementById('step3Form');
        const stepDescription = document.getElementById('stepDescription');
        const btnBackToStep1 = document.getElementById('btnBackToStep1');
        const errorBox = document.getElementById('errorBox');
        let userEmail = '';

        function showError(message) { errorBox.innerText = message; errorBox.classList.add('show'); }
        function hideError() { errorBox.classList.remove('show'); errorBox.innerText = ''; }

        step1Form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();
            const emailInput = document.getElementById('forgotEmail').value;
            const btn = document.getElementById('btnStep1');
            btn.innerText = 'Đang gửi mã...'; btn.disabled = true;

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                const result = await response.json();
                btn.innerText = 'Gửi mã OTP qua Email'; btn.disabled = false;

                if (response.ok) {
                    userEmail = emailInput;
                    step1Form.classList.add('hidden');
                    step2Form.classList.remove('hidden');
                    stepDescription.innerHTML = `Mã xác minh đã được gửi đến hộp thư <b>${userEmail}</b>.`;
                } else {
                    showError(result.message);
                }
            } catch (error) {
                btn.innerText = 'Gửi mã OTP qua Email'; btn.disabled = false;
                showError('Không thể kết nối đến máy chủ Backend!');
            }
        });

        btnBackToStep1.addEventListener('click', function () {
            hideError();
            step2Form.classList.add('hidden');
            step1Form.classList.remove('hidden');
            stepDescription.innerText = 'Nhập địa chỉ email của bạn để nhận mã xác minh.';
        });

        step2Form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();
            const otp = document.getElementById('otpCode').value;
            const btn = document.getElementById('btnStep2');
            btn.innerText = 'Đang kiểm tra...'; btn.disabled = true;

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp: otp })
                });
                const result = await response.json();
                btn.innerText = 'Xác nhận OTP'; btn.disabled = false;

                if (response.ok) {
                    step2Form.classList.add('hidden');
                    step3Form.classList.remove('hidden');
                    stepDescription.innerText = 'Vui lòng tạo mật khẩu mới cho tài khoản của bạn.';
                } else {
                    showError(result.message);
                }
            } catch (error) {
                btn.innerText = 'Xác nhận OTP'; btn.disabled = false;
                showError('Không thể kết nối đến máy chủ Backend!');
            }
        });

        step3Form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('Mật khẩu nhập lại không khớp!'); return;
            }

            const btn = document.getElementById('btnStep3');
            btn.innerText = 'Đang lưu...'; btn.disabled = true;

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, newPassword: newPassword })
                });
                const result = await response.json();
                btn.innerText = 'Lưu mật khẩu mới'; btn.disabled = false;

                if (response.ok) {
                    alert('Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.');
                    // Sửa lệnh chuyển hướng thành /login
                    window.location.href = '/login';
                } else {
                    showError(result.message);
                }
            } catch (error) {
                btn.innerText = 'Lưu mật khẩu mới'; btn.disabled = false;
                showError('Không thể kết nối đến máy chủ Backend!');
            }
        });
    </script>
</body>

</html>
